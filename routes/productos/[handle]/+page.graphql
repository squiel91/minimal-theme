query Product($handle: String!) {
  product(handle: $handle) @required {
    id
    handle
    title
    description
    currency
    priceMinInCents
    priceMaxInCents
    compareAtPriceInCents
    available
    url
    coverImage { url alt }
    images { url alt }
    options { name displayType values { value color image { url alt } } }
    variants { id sku priceInCents compareAtPriceInCents stock available image { url alt } selectedOptions { name value } }
    specifications { name value }
    related(first: 4) { title url currency priceMinInCents priceMaxInCents compareAtPriceInCents available coverImage { url alt } rating reviewsCount }
    seo { title description }
    rating
    reviewsCount
    reviews(first: 10) { nodes { rating content authorName verifiedPurchase createdAt images { url alt } } }
  }
}

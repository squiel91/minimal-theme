# Data for the header, footer, newsletter and theming, on every page.
query Layout {
  store {
    name
    description
    whatsappNumber
    emailAddress
    personalization {
      primaryColor
      primaryButtonTextColor
      rounding
      font { family fallbackFamilies variants { weight style url format } }
    }
  }
  mainMenu: menu(handle: "principal") { items { label url openInNewTab } }
  infoMenu: menu(handle: "footer") { title items { label url openInNewTab } }
  footerCollections: collections(roots: true, first: 12) { nodes { name url } }
  shippingPolicy: page(handle: "politicas-de-envio") { url }
  returnsPolicy: page(handle: "politicas-de-cambios-y-devoluciones") { url }
  privacyPolicy: page(handle: "politicas-de-privacidad") { url }
}
